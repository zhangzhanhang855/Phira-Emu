<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phira Pure Engine</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
      z-index: 10;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }
    .hud-combo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }
    .hud-combo span {
      font-size: 13px;
      font-weight: normal;
      display: block;
      opacity: 0.8;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    #upload-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 8, 12, 0.94);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      gap: 18px;
    }
    .drop-zone {
      width: 380px;
      max-width: 90%;
      padding: 30px 20px;
      border: 2px dashed #00c6ff;
      border-radius: 16px;
      text-align: center;
      background: rgba(0, 198, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover {
      background: rgba(0, 198, 255, 0.12);
    }
    .btn {
      padding: 12px 40px;
      background: linear-gradient(135deg, #1e69ff, #00c6ff);
      border: none;
      border-radius: 28px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 198, 255, 0.35);
    }
    .btn:disabled {
      background: #444;
      box-shadow: none;
      cursor: not-allowed;
    }
    #status-text {
      font-size: 14px;
      color: #8fa3b0;
      max-width: 80%;
      text-align: center;
      line-height: 1.5;
    }
    #file-input {
      display: none;
    }
  </style>
  <!-- 离线/CDN 双重兼容的极简 JSZip，解压资源包 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>
        <div id="ui-song-name" style="font-weight: bold; font-size: 17px;">未载入曲目</div>
        <div id="ui-song-info" style="opacity: 0.65; font-size: 13px;">请导入 .zip 格式谱面包</div>
      </div>
      <div class="hud-combo">
        <div id="combo-num">0</div>
        <span>COMBO</span>
      </div>
      <div style="text-align: right;">
        <div id="score-val" style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;">0000000</div>
        <div id="acc-val" style="opacity: 0.65; font-size: 13px;">100.00%</div>
      </div>
    </div>
  </div>

  <div id="upload-panel">
    <h1 style="letter-spacing: 5px; font-weight: 300; font-size: 28px;">PHIRA ZIP LOADER</h1>
    <div class="drop-zone" id="drop-box">
      <p style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">点击或拖拽选择 .ZIP 资源包</p>
      <p style="font-size: 12px; opacity: 0.7;">支持 Phira/Phigros 完整包（包含 json, 音频, 皮肤, 打击音效）</p>
      <input type="file" id="file-input" accept=".zip">
    </div>
    <div id="status-text">等待导入...</div>
    <button class="btn" id="start-btn" disabled>开始游玩</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx = null;
    let bgmBuffer = null;
    let endingBuffer = null;
    let bgmSource = null;
    let startTime = 0;
    let isPlaying = false;

    // 资源存储库 (全由 ZIP 动态读入)
    const ASSETS = {
      chart: null,
      bgImage: null,
      audioBuffers: {}, // Tap, Drag, Hold, Flick, ending
      images: {}        // Tap, Tap_mh, Drag, Drag_mh, Hold, Hold_mh, Flick, Flick_mh
    };

    let parsedLines = [];
    let score = 0, combo = 0, perfectCount = 0, goodCount = 0, missCount = 0, totalNotes = 0;
    let W = 0, H = 0, scale = 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      scale = Math.min(W / 1280, H / 720);
    }
    window.addEventListener('resize', resize);
    resize();

    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    // 播放打击音效（优先播放 ZIP 提供的音效，备用自带合成）
    function playHitSound(type) {
      if (!audioCtx) return;
      const soundKeys = { 1: "Tap", 2: "Drag", 3: "Hold", 4: "Flick" };
      const key = soundKeys[type];
      if (ASSETS.audioBuffers[key]) {
        const s = audioCtx.createBufferSource();
        s.buffer = ASSETS.audioBuffers[key];
        s.connect(audioCtx.destination);
        s.start(0);
        return;
      }
      // 备用纯音合成器
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 1) {
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.04);
          gain.gain.setValueAtTime(0.7, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t);
          osc.stop(t + 0.04);
        } else if (type === 2) {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(750, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
          osc.start(t);
          osc.stop(t + 0.025);
        } else if (type === 4) {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(900, t);
          osc.frequency.linearRampToValueAtTime(2400, t + 0.06);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (e) {}
    }

    // --- ZIP 资源包解压与解析引擎 ---
    const dropBox = document.getElementById('drop-box');
    const fileInput = document.getElementById('file-input');
    const statusText = document.getElementById('status-text');
    const startBtn = document.getElementById('start-btn');

    dropBox.onclick = () => fileInput.click();
    dropBox.ondragover = (e) => { e.preventDefault(); };
    dropBox.ondrop = (e) => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) handleZipFile(e.dataTransfer.files[0]);
    };
    fileInput.onchange = (e) => {
      if (e.target.files[0]) handleZipFile(e.target.files[0]);
    };

    async function handleZipFile(file) {
      await initAudio();
      statusText.innerText = "正在解压并读取资源包...";
      try {
        const zip = await JSZip.loadAsync(file);
        let chartFile = null;
        let musicFile = null;
        let bgFile = null;

        // 1. 遍历解压资源
        for (let path in zip.files) {
          const entry = zip.files[path];
          if (entry.dir) continue;
          const lower = path.toLowerCase();

          if (lower.endsWith('.json')) {
            const txt = await entry.async('text');
            try {
              const j = JSON.parse(txt);
              if (j.judgeLineList) {
                chartFile = j;
                statusText.innerText = `已载入谱面: ${path}`;
              }
            } catch (err) {}
          } else if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg')) {
            const blob = await entry.async('blob');
            const img = new Image();
            img.src = URL.createObjectURL(blob);
            await new Promise(r => { img.onload = r; });
            
            // 判断是否是音符贴图
            if (lower.includes('tap') || lower.includes('click')) {
              ASSETS.images[lower.includes('mh') ? 'Tap_mh' : 'Tap'] = img;
            } else if (lower.includes('drag')) {
              ASSETS.images[lower.includes('mh') ? 'Drag_mh' : 'Drag'] = img;
            } else if (lower.includes('hold')) {
              ASSETS.images[lower.includes('mh') ? 'Hold_mh' : 'Hold'] = img;
            } else if (lower.includes('flick')) {
              ASSETS.images[lower.includes('mh') ? 'Flick_mh' : 'Flick'] = img;
            } else {
              // 默认较大图片视为背景曲绘
              if (!bgFile || img.width > 500) {
                bgFile = img;
                ASSETS.bgImage = img;
              }
            }
          } else if (lower.endsWith('.ogg') || lower.endsWith('.mp3') || lower.endsWith('.wav')) {
            const ab = await entry.async('arraybuffer');
            const buf = await audioCtx.decodeAudioData(ab);
            
            // 归类打击音效与主曲、结算曲
            if (lower.includes('tap') || lower.includes('click')) ASSETS.audioBuffers['Tap'] = buf;
            else if (lower.includes('drag')) ASSETS.audioBuffers['Drag'] = buf;
            else if (lower.includes('hold')) ASSETS.audioBuffers['Hold'] = buf;
            else if (lower.includes('flick')) ASSETS.audioBuffers['Flick'] = buf;
            else if (lower.includes('ending')) endingBuffer = buf;
            else {
              // 较长音轨视为主背景音乐
              if (!bgmBuffer || buf.duration > 30) {
                bgmBuffer = buf;
              }
            }
          }
        }

        if (!chartFile) throw new Error("ZIP 中未检测到合法的 Phira/Phigros 谱面 JSON 文件！");
        ASSETS.chart = chartFile;

        statusText.innerText = "资源解析成功，随时可以开始！";
        startBtn.disabled = false;
      } catch (err) {
        statusText.innerText = `解析失败: ${err.message}`;
      }
    }

    // --- 多押检测与物理判定线构建 ---
    function prepareChart() {
      if (!ASSETS.chart || !ASSETS.chart.judgeLineList) return;
      totalNotes = 0;

      // 统计全局所有音符的时间戳，出现 >= 2 次的时间标为多押
      const timeCount = new Map();
      ASSETS.chart.judgeLineList.forEach(line => {
        const allNotes = [...(line.notesAbove || []), ...(line.notesBelow || [])];
        allNotes.forEach(n => {
          const t = Math.round(n.time);
          timeCount.set(t, (timeCount.get(t) || 0) + 1);
        });
      });

      parsedLines = ASSETS.chart.judgeLineList.map((line, idx) => {
        const bpm = line.bpm || 140.0;
        const tickToSec = (tick) => (tick / 32) * (60 / bpm);
        const secToTick = (sec) => (sec / (60 / bpm)) * 32;

        let accumulatedFloor = 0;
        const speedEvents = (line.speedEvents || []).map(e => {
          const startFloor = accumulatedFloor;
          const duration = e.endTime - e.startTime;
          // 官方规范换算
          const deltaFloor = (duration / 32) * (e.value / (bpm / 60));
          accumulatedFloor += deltaFloor;
          return {
            startTime: e.startTime,
            endTime: e.endTime,
            value: e.value,
            startFloor: startFloor,
            endFloor: accumulatedFloor
          };
        });

        function getFloorPosAtTick(tick) {
          if (speedEvents.length === 0) return 0;
          if (tick <= speedEvents[0].startTime) return 0;
          const last = speedEvents[speedEvents.length - 1];
          if (tick >= last.endTime) return last.endFloor;

          for (let i = 0; i < speedEvents.length; i++) {
            const ev = speedEvents[i];
            if (tick >= ev.startTime && tick <= ev.endTime) {
              const p = (tick - ev.startTime) / (ev.endTime - ev.startTime || 1);
              return ev.startFloor + (ev.endFloor - ev.startFloor) * p;
            }
          }
          return 0;
        }

        function formatNotes(notes, isAbove) {
          return (notes || []).map(n => {
            totalNotes++;
            const startFloor = (n.floorPosition !== undefined) ? n.floorPosition : getFloorPosAtTick(n.time);
            const endFloor = getFloorPosAtTick(n.time + (n.holdTime || 0));
            const isMulti = (timeCount.get(Math.round(n.time)) || 0) >= 2;

            return {
              type: n.type,
              time: n.time,
              timeSec: tickToSec(n.time),
              holdTime: n.holdTime || 0,
              holdTimeSec: tickToSec(n.holdTime || 0),
              x: n.positionX,
              speed: n.speed || 1.0,
              startFloor: startFloor,
              endFloor: endFloor,
              isAbove: isAbove,
              isMulti: isMulti,
              hit: false,
              miss: false,
              holding: false,
              headHit: false
            };
          });
        }

        return {
          id: idx,
          bpm: bpm,
          tickToSec: tickToSec,
          secToTick: secToTick,
          getFloorPosAtTick: getFloorPosAtTick,
          moveEvents: line.judgeLineMoveEvents || [],
          rotateEvents: line.rotateEvents || line.judgeLineRotateEvents || [],
          disappearEvents: line.judgeLineDisappearEvents || [],
          notes: [...formatNotes(line.notesAbove, true), ...formatNotes(line.notesBelow, false)]
        };
      });
    }

    function evalNumberEvent(events, curTick, defaultVal) {
      if (!events || events.length === 0) return defaultVal;
      if (curTick <= events[0].startTime) return events[0].start;
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return last.end;

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return ev.start + (ev.end - ev.start) * t;
        }
      }
      return defaultVal;
    }

    function evalMoveEvent(events, curTick) {
      if (!events || events.length === 0) return { x: 0.5, y: 0.5 };
      if (curTick <= events[0].startTime) return { x: events[0].start, y: events[0].start2 ?? 0.5 };
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return { x: last.end, y: last.end2 ?? 0.5 };

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return {
            x: ev.start + (ev.end - ev.start) * t,
            y: (ev.start2 ?? 0.5) + ((ev.end2 ?? 0.5) - (ev.start2 ?? 0.5)) * t
          };
        }
      }
      return { x: 0.5, y: 0.5 };
    }

    // --- 触控判定核心（彻底解决 Flick, Drag, Hold）---
    const activeTouches = new Map();

    window.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activeTouches.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY,
        lastX: e.clientX,
        lastY: e.clientY,
        startTime: performance.now(),
        flicked: false
      });
      checkHits(e.clientX, e.clientY, 'tap');
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (activeTouches.has(e.pointerId)) {
        const p = activeTouches.get(e.pointerId);
        const dx = e.clientX - p.lastX;
        const dy = e.clientY - p.lastY;
        const dist = Math.hypot(dx, dy);

        // 检测 Flick 划动速度
        const isFlick = dist > 14;
        p.lastX = e.clientX;
        p.lastY = e.clientY;
        p.x = e.clientX;
        p.y = e.clientY;

        if (isFlick) {
          checkHits(e.clientX, e.clientY, 'flick');
        }
        // 持续检测 Drag 与 Hold 按压
        checkHits(e.clientX, e.clientY, 'drag');
      }
    }, { passive: false });

    function onPointerUp(e) {
      activeTouches.delete(e.pointerId);
    }
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    function checkHits(screenX, screenY, inputType) {
      if (!isPlaying) return;
      const curTime = (audioCtx.currentTime - startTime) + (ASSETS.chart.offset || 0);

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;

        const dx = screenX - lx;
        const dy = screenY - ly;
        const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
        const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

        line.notes.forEach(note => {
          if (note.hit || note.miss) return;
          const dt = curTime - note.timeSec;
          const noteLocalX = (note.x / 9) * (W * 0.42);

          // 宽容判定区域
          const inX = Math.abs(localX - noteLocalX) < (120 * scale);
          const inY = Math.abs(localY) < (140 * scale);

          if (inX && inY) {
            // 1. TAP 判定
            if (note.type === 1 && inputType === 'tap' && Math.abs(dt) <= 0.16) {
              note.hit = true;
              playHitSound(1);
              registerHit(Math.abs(dt) <= 0.08 ? 1.0 : 0.65);
            }
            // 2. DRAG 判定 (只要有手指在有效时间内划过/碰触即可击碎)
            else if (note.type === 2 && Math.abs(dt) <= 0.18) {
              note.hit = true;
              playHitSound(2);
              registerHit(1.0);
            }
            // 3. FLICK 判定 (必须带滑动矢量)
            else if (note.type === 4 && inputType === 'flick' && Math.abs(dt) <= 0.18) {
              note.hit = true;
              playHitSound(4);
              registerHit(1.0);
            }
            // 4. HOLD 判定 (Tap 激活头部，中途持续保持判定)
            else if (note.type === 3) {
              if (inputType === 'tap' && Math.abs(dt) <= 0.16 && !note.headHit) {
                note.headHit = true;
                note.holding = true;
                playHitSound(1);
              } else if (note.headHit && curTime >= note.timeSec && curTime <= note.timeSec + note.holdTimeSec) {
                note.holding = true;
              }
            }
          }
        });
      });
    }

    function registerHit(weight) {
      if (weight === 1.0) perfectCount++;
      else goodCount++;
      combo++;
      updateHUD();
    }

    function registerMiss() {
      missCount++;
      combo = 0;
      updateHUD();
    }

    function updateHUD() {
      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      document.getElementById('combo-num').innerText = combo;
      document.getElementById('score-val').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('acc-val').innerText = acc.toFixed(2) + '%';
    }

    // --- 主渲染管线 ---
    function render() {
      if (!isPlaying) return;

      const curSec = (audioCtx.currentTime - startTime) + (ASSETS.chart.offset || 0);
      ctx.clearRect(0, 0, W, H);

      // 1. 背景绘制
      if (ASSETS.bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        const img = ASSETS.bgImage;
        const imgRatio = img.width / img.height;
        const screenRatio = W / H;
        let dw, dh, dx, dy;
        if (screenRatio > imgRatio) {
          dw = W; dh = W / imgRatio; dx = 0; dy = (H - dh) / 2;
        } else {
          dh = H; dw = H * imgRatio; dx = (W - dw) / 2; dy = 0;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      }

      // 2. 判定线与音符
      parsedLines.forEach(line => {
        const curTick = line.secToTick(curSec);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const lineAlpha = evalNumberEvent(line.disappearEvents, curTick, 1.0);
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((rotDeg * Math.PI) / 180);

        // 核心修复 1: 判定线无限延伸（贯穿全屏）
        if (lineAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = lineAlpha;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5 * scale;
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 5 * scale;
          ctx.beginPath();
          ctx.moveTo(-W * 4, 0);
          ctx.lineTo(W * 4, 0);
          ctx.stroke();
          ctx.restore();
        }

        // 音符渲染
        line.notes.forEach(note => {
          if (note.hit) return;

          // 超时判定
          if (curSec - note.timeSec > 0.18 && !note.hit && !note.miss) {
            note.miss = true;
            registerMiss();
            return;
          }

          // Hold 结算
          if (note.type === 3 && note.headHit && curSec >= note.timeSec + note.holdTimeSec) {
            note.hit = true;
            registerHit(1.0);
            return;
          }

          // 时间窗剪裁
          const timeToHit = note.timeSec - curSec;
          if (timeToHit < -0.25 || timeToHit > 2.2) return;

          // 核心修复 2: 严格对齐判定线（击打时刻 dist 严格为 0）
          const floorDiff = note.startFloor - curFloorPos;
          const dist = floorDiff * 380 * scale;
          const noteY = note.isAbove ? -dist : dist;
          const noteX = (note.x / 9) * (W * 0.42);

          if (Math.abs(noteY) > H * 1.5) return;

          ctx.save();
          ctx.translate(noteX, noteY);

          const nw = 110 * scale;
          const nh = 16 * scale;

          // 贴图选择 (具备多押 _mh 自动切换)
          const isMh = note.isMulti;

          if (note.type === 1) { // Tap
            const img = isMh ? ASSETS.images['Tap_mh'] : ASSETS.images['Tap'];
            if (img) {
              ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            } else {
              ctx.fillStyle = isMh ? '#ffeb3b' : '#03a9f4';
              ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
              ctx.strokeStyle = '#fff';
              ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
            }
          } else if (note.type === 2) { // Drag
            const img = isMh ? ASSETS.images['Drag_mh'] : ASSETS.images['Drag'];
            if (img) {
              ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            } else {
              ctx.fillStyle = '#ffeb3b';
              ctx.fillRect(-nw / 2.2, -nh / 2.5, nw / 1.1, nh / 1.25);
            }
          } else if (note.type === 3) { // Hold (贴图长条与头尾)
            const floorSpan = Math.max(0.01, note.endFloor - note.startFloor);
            const holdLen = floorSpan * 380 * scale;
            const holdImg = isMh ? ASSETS.images['Hold_mh'] : ASSETS.images['Hold'];

            if (holdImg) {
              if (note.isAbove) {
                ctx.drawImage(holdImg, -nw / 2, -holdLen, nw, holdLen);
              } else {
                ctx.drawImage(holdImg, -nw / 2, 0, nw, holdLen);
              }
            } else {
              ctx.fillStyle = isMh ? 'rgba(255, 235, 59, 0.4)' : 'rgba(3, 169, 244, 0.35)';
              if (note.isAbove) {
                ctx.fillRect(-nw / 2, -holdLen, nw, holdLen);
              } else {
                ctx.fillRect(-nw / 2, 0, nw, holdLen);
              }
            }

            // 头部基准
            const headImg = isMh ? ASSETS.images['Tap_mh'] : ASSETS.images['Tap'];
            if (headImg) {
              ctx.drawImage(headImg, -nw / 2, -nh / 2, nw, nh);
            } else {
              ctx.fillStyle = isMh ? '#ffeb3b' : '#03a9f4';
              ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
            }
          } else if (note.type === 4) { // Flick
            const img = isMh ? ASSETS.images['Flick_mh'] : ASSETS.images['Flick'];
            if (img) {
              ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
            } else {
              ctx.fillStyle = '#ff1744';
              ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
              ctx.fillStyle = '#fff';
              ctx.fillRect(-nw / 6, -nh / 4, nw / 3, nh / 2);
            }
          }

          ctx.restore();
        });

        ctx.restore();
      });

      // 检查曲目结束 -> 播放 ending
      if (bgmBuffer && curSec > bgmBuffer.duration + 1.0) {
        isPlaying = false;
        if (endingBuffer) {
          const endSrc = audioCtx.createBufferSource();
          endSrc.buffer = endingBuffer;
          endSrc.connect(audioCtx.destination);
          endSrc.start(0);
        }
      }

      requestAnimationFrame(render);
    }

    // --- 开始游玩 ---
    startBtn.onclick = () => {
      if (!ASSETS.chart) return;
      prepareChart();
      document.getElementById('upload-panel').style.display = 'none';
      isPlaying = true;

      if (bgmBuffer) {
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = bgmBuffer;
        bgmSource.connect(audioCtx.destination);
        startTime = audioCtx.currentTime;
        bgmSource.start(0);
      } else {
        startTime = audioCtx.currentTime;
      }

      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
