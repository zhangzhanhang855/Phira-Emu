<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phira Core Player - Cryogenic</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    }
    .hud-combo {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .hud-combo span {
      font-size: 13px;
      font-weight: 400;
      display: block;
      opacity: 0.8;
      letter-spacing: 1px;
    }
    #start-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 4, 8, 0.94);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
    }
    .btn {
      padding: 12px 42px;
      background: linear-gradient(135deg, #1e69ff, #00c6ff);
      border: none;
      border-radius: 28px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 198, 255, 0.35);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .file-input-group {
      font-size: 12px;
      color: #888;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>
        <div style="font-weight: bold; font-size: 16px;">Cryogenic</div>
        <div style="opacity: 0.7; font-size: 12px;">IN Lv.15 | Camellia ft. Petra Gurin</div>
      </div>
      <div class="hud-combo">
        <div id="combo-num">0</div>
        <span>COMBO</span>
      </div>
      <div style="text-align: right;">
        <div id="score-val" style="font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums;">0000000</div>
        <div id="acc-val" style="opacity: 0.7; font-size: 12px;">100.00%</div>
      </div>
    </div>
  </div>

  <div id="start-panel">
    <h1 style="letter-spacing: 5px; font-weight: 300;">PHIRA PLAYER</h1>
    <p style="color: #8fa3b0; font-size: 14px;">Cryogenic [IN Lv.15]</p>
    <button class="btn" id="start-btn">开始游玩</button>
    <div class="file-input-group">
      <span>离线环境备选：</span>
      <input type="file" id="manual-files" multiple accept=".json,.ogg,.mp3,.png">
    </div>
  </div>

  <script>
    const CONFIG = {
      chartFile: "2879060597059264.json",
      audioFile: "2879060597059264.ogg",
      bgFile: "2879060597059264.png",
      baseBPM: 145.0
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let startTime = 0;
    let isPlaying = false;
    let chartData = null;
    let bgImg = new Image();
    let bgLoaded = false;

    let score = 0;
    let combo = 0;
    let perfectCount = 0;
    let goodCount = 0;
    let missCount = 0;
    let totalNotes = 0;

    let W = 0, H = 0, scale = 1;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      scale = Math.min(W / 1280, H / 720);
    }
    window.addEventListener('resize', resize);
    resize();

    // 音效发生器
    function playHitSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 1) { // Tap
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, t);
          osc.frequency.exponentialRampToValueAtTime(300, t + 0.04);
          gain.gain.setValueAtTime(0.7, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          osc.start(t);
          osc.stop(t + 0.04);
        } else if (type === 2) { // Drag
          osc.type = "triangle";
          osc.frequency.setValueAtTime(750, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
          osc.start(t);
          osc.stop(t + 0.025);
        } else if (type === 4) { // Flick
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(900, t);
          osc.frequency.linearRampToValueAtTime(2400, t + 0.06);
          gain.gain.setValueAtTime(0.6, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.start(t);
          osc.stop(t + 0.06);
        }
      } catch (e) {}
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    async function tryAutoLoad() {
      try {
        const [cRes, aRes] = await Promise.all([
          fetch(CONFIG.chartFile).then(r => r.json()),
          fetch(CONFIG.audioFile).then(r => r.arrayBuffer())
        ]);
        chartData = cRes;
        await initAudio();
        audioBuffer = await audioCtx.decodeAudioData(aRes);
        bgImg.src = CONFIG.bgFile;
        bgImg.onload = () => { bgLoaded = true; };
      } catch (e) {}
    }
    tryAutoLoad();

    document.getElementById('manual-files').addEventListener('change', async (e) => {
      await initAudio();
      for (let f of e.target.files) {
        if (f.name.endsWith('.json')) {
          chartData = JSON.parse(await f.text());
        } else if (f.name.endsWith('.ogg') || f.name.endsWith('.mp3')) {
          audioBuffer = await audioCtx.decodeAudioData(await f.arrayBuffer());
        } else if (f.name.endsWith('.png') || f.name.endsWith('.jpg')) {
          bgImg.src = URL.createObjectURL(f);
          bgImg.onload = () => { bgLoaded = true; };
        }
      }
    });

    // --- 严谨官方标准解析与预积分 ---
    let parsedLines = [];

    function prepareChart() {
      if (!chartData || !chartData.judgeLineList) return;
      totalNotes = 0;

      parsedLines = chartData.judgeLineList.map((line, idx) => {
        const bpm = line.bpm || CONFIG.baseBPM;
        const tickToSec = (tick) => (tick / 32) * (60 / bpm);
        const secToTick = (sec) => (sec / (60 / bpm)) * 32;

        // 1. 构建速度积分表 (前缀和积分，严格对应每个 SpeedEvent 起始点的真实 floorPosition)
        let accumulatedFloor = 0;
        const speedEvents = (line.speedEvents || []).map((e) => {
          const startFloor = accumulatedFloor;
          const duration = e.endTime - e.startTime;
          // 官方规范：每 32 ticks 对应 (value) 单位位移，时间因子按标准 BPM/速度换算
          // 官方公式中 Note 的 floorPosition 导出规则为：dt / 32 * value * (60/bpm) 或标准归一化单位
          // 这里通过谱面实际给出的值，严格还原每 tick 的位移增量：
          const deltaFloor = (duration / 32) * (e.value / (bpm / 60)); 
          accumulatedFloor += deltaFloor;
          return {
            startTime: e.startTime,
            endTime: e.endTime,
            value: e.value,
            startFloor: startFloor,
            endFloor: accumulatedFloor
          };
        });

        // 二分/查找当前 Tick 的真实 floorPosition
        function getFloorPosAtTick(tick) {
          if (speedEvents.length === 0) return 0;
          if (tick <= speedEvents[0].startTime) return 0;
          const last = speedEvents[speedEvents.length - 1];
          if (tick >= last.endTime) return last.endFloor;

          for (let i = 0; i < speedEvents.length; i++) {
            const ev = speedEvents[i];
            if (tick >= ev.startTime && tick <= ev.endTime) {
              const p = (tick - ev.startTime) / (ev.endTime - ev.startTime || 1);
              return ev.startFloor + (ev.endFloor - ev.startFloor) * p;
            }
          }
          return 0;
        }

        function formatNotes(notes, isAbove) {
          return (notes || []).map(n => {
            totalNotes++;
            // 如果 JSON 自带 floorPosition 则使用原生，否则从速度表精确计算
            const startFloor = (n.floorPosition !== undefined) ? n.floorPosition : getFloorPosAtTick(n.time);
            const endFloor = getFloorPosAtTick(n.time + (n.holdTime || 0));

            return {
              type: n.type,
              time: n.time,
              timeSec: tickToSec(n.time),
              holdTime: n.holdTime || 0,
              holdTimeSec: tickToSec(n.holdTime || 0),
              x: n.positionX,
              speed: n.speed || 1.0,
              startFloor: startFloor,
              endFloor: endFloor,
              isAbove: isAbove,
              hit: false,
              miss: false,
              holding: false
            };
          });
        }

        return {
          id: idx,
          bpm: bpm,
          tickToSec: tickToSec,
          secToTick: secToTick,
          getFloorPosAtTick: getFloorPosAtTick,
          moveEvents: line.judgeLineMoveEvents || [],
          rotateEvents: line.judgeLineRotateEvents || [],
          disappearEvents: line.judgeLineDisappearEvents || [],
          notes: [...formatNotes(line.notesAbove, true), ...formatNotes(line.notesBelow, false)]
        };
      });
    }

    function evalNumberEvent(events, curTick, defaultVal) {
      if (!events || events.length === 0) return defaultVal;
      if (curTick <= events[0].startTime) return events[0].start;
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return last.end;

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return ev.start + (ev.end - ev.start) * t;
        }
      }
      return defaultVal;
    }

    function evalMoveEvent(events, curTick) {
      if (!events || events.length === 0) return { x: 0.5, y: 0.5 };
      if (curTick <= events[0].startTime) return { x: events[0].start, y: events[0].start2 ?? 0.5 };
      const last = events[events.length - 1];
      if (curTick >= last.endTime) return { x: last.end, y: last.end2 ?? 0.5 };

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          return {
            x: ev.start + (ev.end - ev.start) * t,
            y: (ev.start2 ?? 0.5) + ((ev.end2 ?? 0.5) - (ev.start2 ?? 0.5)) * t
          };
        }
      }
      return { x: 0.5, y: 0.5 };
    }

    // --- 触控交互处理 ---
    const activeTouches = new Map();

    window.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      processHit(e.clientX, e.clientY, 'tap');
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (activeTouches.has(e.pointerId)) {
        const p = activeTouches.get(e.pointerId);
        const dx = e.clientX - p.x;
        const dy = e.clientY - p.y;
        p.x = e.clientX;
        p.y = e.clientY;
        const isFlick = Math.hypot(dx, dy) > 12;
        processHit(e.clientX, e.clientY, isFlick ? 'flick' : 'drag');
      }
    }, { passive: false });

    window.addEventListener('pointerup', (e) => { activeTouches.delete(e.pointerId); });
    window.addEventListener('pointercancel', (e) => { activeTouches.delete(e.pointerId); });

    function processHit(screenX, screenY, inputType) {
      if (!isPlaying) return;
      const curTime = (audioCtx.currentTime - startTime) + (chartData.offset || 0);

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curTime);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;

        const dx = screenX - lx;
        const dy = screenY - ly;
        const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
        const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

        line.notes.forEach(note => {
          if (note.hit || note.miss) return;
          const dt = curTime - note.timeSec;
          const noteLocalX = (note.x / 9) * (W * 0.42);

          const inX = Math.abs(localX - noteLocalX) < (100 * scale);
          const inY = Math.abs(localY) < (120 * scale);

          if (inX && inY && Math.abs(dt) <= 0.18) {
            if (note.type === 1 && inputType === 'tap') {
              note.hit = true;
              playHitSound(1);
              registerHit(Math.abs(dt) <= 0.08 ? 1.0 : 0.65);
            } else if (note.type === 2) {
              note.hit = true;
              playHitSound(2);
              registerHit(1.0);
            } else if (note.type === 4 && (inputType === 'flick' || inputType === 'drag')) {
              note.hit = true;
              playHitSound(4);
              registerHit(1.0);
            } else if (note.type === 3 && inputType === 'tap') {
              note.holding = true;
              playHitSound(1);
            }
          }
        });
      });
    }

    function registerHit(weight) {
      if (weight === 1.0) perfectCount++;
      else goodCount++;
      combo++;
      updateHUD();
    }

    function registerMiss() {
      missCount++;
      combo = 0;
      updateHUD();
    }

    function updateHUD() {
      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      document.getElementById('combo-num').innerText = combo;
      document.getElementById('score-val').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('acc-val').innerText = acc.toFixed(2) + '%';
    }

    // --- 主循环渲染 ---
    function render() {
      if (!isPlaying) return;

      const curSec = (audioCtx.currentTime - startTime) + (chartData.offset || 0);
      ctx.clearRect(0, 0, W, H);

      // 背景
      if (bgLoaded) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        const imgRatio = bgImg.width / bgImg.height;
        const screenRatio = W / H;
        let dw, dh, dx, dy;
        if (screenRatio > imgRatio) {
          dw = W;
          dh = W / imgRatio;
          dx = 0;
          dy = (H - dh) / 2;
        } else {
          dh = H;
          dw = H * imgRatio;
          dx = (W - dw) / 2;
          dy = 0;
        }
        ctx.drawImage(bgImg, dx, dy, dw, dh);
        ctx.restore();
      }

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curSec);
        const linePos = evalMoveEvent(line.moveEvents, curTick);
        const rotDeg = evalNumberEvent(line.rotateEvents, curTick, 0);
        const lineAlpha = evalNumberEvent(line.disappearEvents, curTick, 1.0);
        
        // 判定线当前的绝对物理位置
        const curFloorPos = line.getFloorPosAtTick(curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((rotDeg * Math.PI) / 180);

        // 仅在透明度 > 0 时绘制判定线
        if (lineAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = lineAlpha;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5 * scale;
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 4 * scale;
          const halfLineLen = W * 0.35;
          ctx.beginPath();
          ctx.moveTo(-halfLineLen, 0);
          ctx.lineTo(halfLineLen, 0);
          ctx.stroke();
          ctx.restore();
        }

        // 音符渲染
        line.notes.forEach(note => {
          if (note.hit) return;

          // 超时判定
          if (curSec - note.timeSec > 0.18 && !note.hit && !note.miss) {
            note.miss = true;
            registerMiss();
            return;
          }

          // 核心修复点：精确的时间窗口过滤与物理落距计算
          const timeToHit = note.timeSec - curSec;
          // 只有离击打时间在 -0.2s 到 2.2s 内的才需要处理，杜绝提前倒下来
          if (timeToHit < -0.25 || timeToHit > 2.2) return;

          // 落差比例严格缩放
          const floorDiff = note.startFloor - curFloorPos;
          const dist = floorDiff * 380 * scale; // 调整为真实的音符流速系数
          const noteY = note.isAbove ? -dist : dist;
          const noteX = (note.x / 9) * (W * 0.42);

          // 超出屏幕视野上下边界不绘制
          if (Math.abs(noteY) > H * 1.2) return;

          ctx.save();
          ctx.translate(noteX, noteY);

          const nw = 100 * scale;
          const nh = 14 * scale;

          if (note.type === 1) { // Tap
            ctx.fillStyle = '#03a9f4';
            ctx.beginPath();
            ctx.roundRect(-nw / 2, -nh / 2, nw, nh, 3 * scale);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();
          } else if (note.type === 2) { // Drag
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.roundRect(-nw / 2.2, -nh / 2.5, nw / 1.1, nh / 1.25, 3 * scale);
            ctx.fill();
          } else if (note.type === 3) { // Hold: 身体长度也基于 floorSpan
            const floorSpan = Math.max(0.01, note.endFloor - note.startFloor);
            const holdLen = floorSpan * 380 * scale;

            ctx.fillStyle = 'rgba(3, 169, 244, 0.35)';
            if (note.isAbove) {
              ctx.fillRect(-nw / 2, -holdLen, nw, holdLen);
            } else {
              ctx.fillRect(-nw / 2, 0, nw, holdLen);
            }

            // 头部打击线
            ctx.fillStyle = '#03a9f4';
            ctx.fillRect(-nw / 2, -nh / 2, nw, nh);

            if (curSec >= note.timeSec + note.holdTimeSec && !note.hit) {
              note.hit = true;
              registerHit(1.0);
            }
          } else if (note.type === 4) { // Flick
            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.roundRect(-nw / 2, -nh / 2, nw, nh, 3 * scale);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-nw / 6, -nh / 4, nw / 3, nh / 2);
          }

          ctx.restore();
        });

        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
      await initAudio();
      if (!chartData) {
        alert("未读取到谱面文件，请使用手动文件选取！");
        return;
      }
      prepareChart();

      document.getElementById('start-panel').style.display = 'none';
      isPlaying = true;

      if (audioBuffer) {
        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(audioCtx.destination);
        startTime = audioCtx.currentTime;
        audioSource.start(0);
      } else {
        startTime = audioCtx.currentTime;
      }

      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
