<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phira Engine - Cryogenic</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }
    .hud-combo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }
    .hud-combo span {
      font-size: 13px;
      font-weight: 400;
      display: block;
      opacity: 0.8;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    #start-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 8, 12, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
    }
    .btn {
      padding: 14px 44px;
      background: linear-gradient(135deg, #1e69ff, #00c6ff);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.35);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .file-input-group {
      font-size: 13px;
      color: #888;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }
    input[type="file"] {
      color: #bbb;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>
        <div style="font-weight: 700; font-size: 18px;">Cryogenic</div>
        <div style="opacity: 0.65; font-size: 13px;">IN Lv.15 | Camellia ft. Petra Gurin</div>
      </div>
      <div class="hud-combo">
        <div id="combo-num">0</div>
        <span>COMBO</span>
      </div>
      <div style="text-align: right;">
        <div id="score-val" style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;">0000000</div>
        <div id="acc-val" style="opacity: 0.65; font-size: 13px;">100.00%</div>
      </div>
    </div>
  </div>

  <div id="start-panel">
    <h1 style="letter-spacing: 6px; font-weight: 300; font-size: 32px;">PHIRA ENGINE</h1>
    <p style="color: #8fa3b0; font-size: 14px;">Cryogenic - [IN Lv.15]</p>
    <button class="btn" id="start-btn">开始游玩</button>
    <div class="file-input-group">
      <span>离线沙盒若未自动加载，请选择本地对应资源：</span>
      <input type="file" id="manual-files" multiple accept=".json,.ogg,.mp3,.png">
    </div>
  </div>

  <script>
    const CONFIG = {
      chartFile: "2879060597059264.json",
      audioFile: "2879060597059264.ogg",
      bgFile: "2879060597059264.png",
      baseBPM: 145.0
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let startTime = 0;
    let isPlaying = false;
    let chartData = null;
    let bgImg = new Image();
    let bgLoaded = false;

    let score = 0;
    let combo = 0;
    let perfectCount = 0;
    let goodCount = 0;
    let missCount = 0;
    let totalNotes = 0;

    // 屏幕适配
    let W = 0, H = 0, scale = 1;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      // 标准设计宽度基准取 1366
      scale = Math.min(W / 1366, H / 768);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Web Audio 实时打击音效合成器 (零资源依赖) ---
    function playHitSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 1) { // Tap: 清脆高频 Tick
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 2) { // Drag: 柔和中频 Click
          osc.type = "triangle";
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.start(now);
          osc.stop(now + 0.03);
        } else if (type === 4) { // Flick: 呼啸高频 Swipe
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.linearRampToValueAtTime(2200, now + 0.07);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        }
      } catch (err) {}
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    // 自动加载资源
    async function tryAutoLoad() {
      try {
        const [cRes, aRes] = await Promise.all([
          fetch(CONFIG.chartFile).then(r => r.json()),
          fetch(CONFIG.audioFile).then(r => r.arrayBuffer())
        ]);
        chartData = cRes;
        await initAudio();
        audioBuffer = await audioCtx.decodeAudioData(aRes);
        bgImg.src = CONFIG.bgFile;
        bgImg.onload = () => { bgLoaded = true; };
      } catch (e) {
        console.warn("自动加载受限，可通过手动文件选择装载:", e);
      }
    }
    tryAutoLoad();

    document.getElementById('manual-files').addEventListener('change', async (e) => {
      await initAudio();
      for (let f of e.target.files) {
        if (f.name.endsWith('.json')) {
          chartData = JSON.parse(await f.text());
        } else if (f.name.endsWith('.ogg') || f.name.endsWith('.mp3')) {
          audioBuffer = await audioCtx.decodeAudioData(await f.arrayBuffer());
        } else if (f.name.endsWith('.png') || f.name.endsWith('.jpg')) {
          bgImg.src = URL.createObjectURL(f);
          bgImg.onload = () => { bgLoaded = true; };
        }
      }
    });

    // --- 严谨判定线物理与音符管线 ---
    let parsedLines = [];

    function prepareChart() {
      if (!chartData || !chartData.judgeLineList) return;
      totalNotes = 0;

      parsedLines = chartData.judgeLineList.map((line, idx) => {
        const bpm = line.bpm || CONFIG.baseBPM;
        const tickToSec = (tick) => (tick / 32) * (60 / bpm);
        const secToTick = (sec) => (sec / (60 / bpm)) * 32;

        // 预处理速度事件以进行快速积分 (floorPosition 计算)
        const speedEvents = (line.speedEvents || []).map(e => ({
          startTime: e.startTime,
          endTime: e.endTime,
          value: e.value,
          floorPos: e.floorPosition || 0
        }));

        function formatNotes(notes, isAbove) {
          return (notes || []).map(n => {
            totalNotes++;
            return {
              type: n.type,
              time: n.time,
              timeSec: tickToSec(n.time),
              holdTime: n.holdTime || 0,
              holdTimeSec: tickToSec(n.holdTime || 0),
              x: n.positionX,
              speed: n.speed || 1.0,
              floorPosition: n.floorPosition,
              isAbove: isAbove,
              hit: false,
              miss: false,
              holding: false
            };
          });
        }

        return {
          id: idx,
          bpm: bpm,
          tickToSec: tickToSec,
          secToTick: secToTick,
          moveEvents: line.judgeLineMoveEvents || [],
          rotateEvents: line.judgeLineRotateEvents || [],
          speedEvents: speedEvents,
          notes: [...formatNotes(line.notesAbove, true), ...formatNotes(line.notesBelow, false)]
        };
      });
    }

    // 严谨区间插值 (Clamp)
    function evalEvent(events, curTick, isMove) {
      if (!events || events.length === 0) return isMove ? { x: 0.5, y: 0.5 } : 0;
      if (curTick <= events[0].startTime) {
        return isMove ? { x: events[0].start, y: events[0].start2 ?? 0.5 } : events[0].start;
      }
      const last = events[events.length - 1];
      if (curTick >= last.endTime) {
        return isMove ? { x: last.end, y: last.end2 ?? 0.5 } : last.end;
      }
      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        if (curTick >= ev.startTime && curTick <= ev.endTime) {
          const t = (curTick - ev.startTime) / (ev.endTime - ev.startTime || 1);
          if (isMove) {
            return {
              x: ev.start + (ev.end - ev.start) * t,
              y: (ev.start2 ?? 0.5) + ((ev.end2 ?? 0.5) - (ev.start2 ?? 0.5)) * t
            };
          } else {
            return ev.start + (ev.end - ev.start) * t;
          }
        }
      }
      return isMove ? { x: 0.5, y: 0.5 } : 0;
    }

    // 当前 tick 对应的线 floorPosition
    function getLineFloorPosition(speedEvents, curTick) {
      if (!speedEvents || speedEvents.length === 0) return curTick * 0.01;
      let pos = 0;
      for (let i = 0; i < speedEvents.length; i++) {
        const ev = speedEvents[i];
        if (curTick >= ev.endTime) {
          pos += (ev.endTime - ev.startTime) * (ev.value / 32);
        } else if (curTick >= ev.startTime) {
          pos += (curTick - ev.startTime) * (ev.value / 32);
          return pos;
        } else {
          break;
        }
      }
      return pos;
    }

    // --- 高灵敏度多指抗断触引擎 ---
    const activeTouches = new Map();

    window.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY, time: performance.now(), type: 'down' });
      processHit(e.clientX, e.clientY, 'tap');
    }, { passive: false });

    window.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (activeTouches.has(e.pointerId)) {
        const p = activeTouches.get(e.pointerId);
        const dx = e.clientX - p.x;
        const dy = e.clientY - p.y;
        p.x = e.clientX;
        p.y = e.clientY;
        const isFlick = (Math.hypot(dx, dy) > 12);
        processHit(e.clientX, e.clientY, isFlick ? 'flick' : 'drag');
      }
    }, { passive: false });

    function clearTouch(id) {
      activeTouches.delete(id);
    }
    window.addEventListener('pointerup', (e) => clearTouch(e.pointerId));
    window.addEventListener('pointercancel', (e) => clearTouch(e.pointerId));

    function processHit(screenX, screenY, inputType) {
      if (!isPlaying) return;
      const curTime = (audioCtx.currentTime - startTime) + (chartData.offset || 0);

      parsedLines.forEach(line => {
        const curTick = line.secToTick(curTime);
        const linePos = evalEvent(line.moveEvents, curTick, true);
        const rotDeg = evalEvent(line.rotateEvents, curTick, false);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;
        const rad = (-rotDeg * Math.PI) / 180;

        // 将触控点转换进判定线的局部坐标系
        const dx = screenX - lx;
        const dy = screenY - ly;
        const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
        const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

        line.notes.forEach(note => {
          if (note.hit || note.miss) return;
          const dt = curTime - note.timeSec;
          const noteLocalX = (note.x / 9) * (W * 0.42);

          // 宽容横向与纵向判定盒 (避免判定范围太小导致按不到)
          const inXBounds = Math.abs(localX - noteLocalX) < (110 * scale);
          const inYBounds = Math.abs(localY) < (140 * scale);

          if (inXBounds && inYBounds && Math.abs(dt) <= 0.18) {
            if (note.type === 1 && inputType === 'tap') { // Tap
              note.hit = true;
              playHitSound(1);
              registerHit(Math.abs(dt) <= 0.08 ? 1.0 : 0.65);
            } else if (note.type === 2) { // Drag (只要有触摸点即可消除)
              note.hit = true;
              playHitSound(2);
              registerHit(1.0);
            } else if (note.type === 4 && (inputType === 'flick' || inputType === 'drag')) { // Flick
              note.hit = true;
              playHitSound(4);
              registerHit(1.0);
            } else if (note.type === 3 && inputType === 'tap') { // Hold 头判定
              note.holding = true;
              playHitSound(1);
            }
          }
        });
      });
    }

    function registerHit(weight) {
      if (weight === 1.0) perfectCount++;
      else goodCount++;
      combo++;
      updateHUD();
    }

    function registerMiss() {
      missCount++;
      combo = 0;
      updateHUD();
    }

    function updateHUD() {
      const processed = perfectCount + goodCount + missCount;
      const totalScore = processed === 0 ? 0 : Math.round(((perfectCount + goodCount * 0.65) / totalNotes) * 1000000);
      const acc = processed === 0 ? 100 : (((perfectCount + goodCount * 0.65) / processed) * 100);

      document.getElementById('combo-num').innerText = combo;
      document.getElementById('score-val').innerText = totalScore.toString().padStart(7, '0');
      document.getElementById('acc-val').innerText = acc.toFixed(2) + '%';
    }

    // --- 主渲染管线 ---
    function render() {
      if (!isPlaying) return;

      const curSec = (audioCtx.currentTime - startTime) + (chartData.offset || 0);
      ctx.clearRect(0, 0, W, H);

      // 1. 曲绘背景绘制
      if (bgLoaded) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.drawImage(bgImg, 0, 0, W, H);
        ctx.restore();
      }

      // 2. 判定线与音符
      parsedLines.forEach(line => {
        const curTick = line.secToTick(curSec);
        const linePos = evalEvent(line.moveEvents, curTick, true);
        const rotDeg = evalEvent(line.rotateEvents, curTick, false);
        const curFloorPos = getLineFloorPosition(line.speedEvents, curTick);

        const lx = linePos.x * W;
        const ly = (1.0 - linePos.y) * H;

        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((rotDeg * Math.PI) / 180);

        // 判定线高亮绘制
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.5 * scale;
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 6 * scale;
        ctx.beginPath();
        ctx.moveTo(-W * 0.65, 0);
        ctx.lineTo(W * 0.65, 0);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 音符渲染
        line.notes.forEach(note => {
          if (note.hit) return;

          // 超时 Miss 判定
          if (curSec - note.timeSec > 0.18 && !note.hit && !note.miss) {
            note.miss = true;
            registerMiss();
            return;
          }

          // 核心修复：基于 floorPosition 差值还原准确位移与变速
          const floorDiff = note.floorPosition - curFloorPos;
          const dist = floorDiff * 140 * scale; 
          const noteScreenY = note.isAbove ? -dist : dist;
          const noteScreenX = (note.x / 9) * (W * 0.42);

          // 视野范围外跳过绘制
          if (Math.abs(dist) > H * 1.5) return;

          ctx.save();
          ctx.translate(noteScreenX, noteScreenY);

          // 放大音符尺寸 (匹配原版宽度约 120px)
          const nw = 110 * scale;
          const nh = 14 * scale;

          if (note.type === 1) { // Tap: 亮天蓝
            ctx.fillStyle = '#03a9f4';
            ctx.beginPath();
            ctx.roundRect(-nw / 2, -nh / 2, nw, nh, 4 * scale);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();
          } else if (note.type === 2) { // Drag: 金黄
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.roundRect(-nw / 2.2, -nh / 2.5, nw / 1.1, nh / 1.25, 3 * scale);
            ctx.fill();
          } else if (note.type === 3) { // Hold: 纯正拖尾长条
            const holdFloorSpan = (note.holdTime / 32) * (60 / line.bpm) * (note.speed || 1.0) * 12;
            const holdLen = holdFloorSpan * 140 * scale;

            ctx.fillStyle = 'rgba(3, 169, 244, 0.35)';
            ctx.fillRect(-nw / 2, note.isAbove ? 0 : -holdLen, nw, holdLen);

            // 头部打击点
            ctx.fillStyle = '#03a9f4';
            ctx.fillRect(-nw / 2, -nh / 2, nw, nh);

            // 判定长条结算
            if (curSec >= note.timeSec + note.holdTimeSec && !note.hit) {
              note.hit = true;
              registerHit(1.0);
            }
          } else if (note.type === 4) { // Flick: 荧光红 / 箭头感
            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.roundRect(-nw / 2, -nh / 2, nw, nh, 4 * scale);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(-nw / 6, -nh / 4, nw / 3, nh / 2);
          }

          ctx.restore();
        });

        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
      await initAudio();
      if (!chartData) {
        alert("未读取到谱面文件，请使用手动文件选取！");
        return;
      }
      prepareChart();

      document.getElementById('start-panel').style.display = 'none';
      isPlaying = true;

      if (audioBuffer) {
        audioSource = audioCtx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(audioCtx.destination);
        startTime = audioCtx.currentTime;
        audioSource.start(0);
      } else {
        startTime = audioCtx.currentTime;
      }

      requestAnimationFrame(render);
    });
  </script>
</body>
</html>
